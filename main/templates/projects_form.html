{% extends "base.html" %}

{% block content %}
<main class="form-page">
    <h1>Tambah Proyek Baru</h1>
    <form method="post" action="{% url 'main:create_project' %}" class="project-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit" class="button">Simpan Proyek</button>
    </form>
</main>
{% endblock content %}
