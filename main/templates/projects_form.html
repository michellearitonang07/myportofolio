{% extends "base.html" %}

{% block content %}
<main class="container">
    <h1>Tambah Proyek Baru</h1>
    <form method="post" action="{% url 'main:create_project' %}">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit" class="button">Simpan Proyek</button>
    </form>
</main>
{% endblock content %}
