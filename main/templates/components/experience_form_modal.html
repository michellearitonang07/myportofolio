<div id="add-experience-modal" class="project-form-modal" popover="auto"
     role="dialog" aria-modal="true" aria-labelledby="add-experience-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="add-experience-modal"
            popovertargetaction="hide" aria-label="Tutup form tambah pengalaman" tabindex="-1"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="add-experience-modal"
                popovertargetaction="hide" aria-label="Tutup form tambah pengalaman">×</button>
        <h2 id="add-experience-modal-title">Tambah Pengalaman</h2>
        <form id="experience-form" class="project-form" method="post"
              action="{% url 'main:create_experience' %}" data-create-url="{% url 'main:create_experience_ajax' %}" novalidate>
            {% csrf_token %}
            <div id="experience-form-errors" class="form-error" role="alert" tabindex="-1"></div>
            <fieldset class="experience-fields">
                <legend class="visually-hidden">Informasi pengalaman baru</legend>
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<p class="form-help" id="{{ field.id_for_label }}_help">{{ field.help_text }}</p>{% endif %}
                    <ul class="errorlist" id="{{ field.id_for_label }}_errors" data-field-errors="{{ field.name }}"></ul>
                </div>
                {% endfor %}
            </fieldset>
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="add-experience-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Simpan Pengalaman</button>
            </div>
        </form>
    </div>
</div>
