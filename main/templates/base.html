{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block meta %}
    <title>Portfolio</title>
    {% endblock meta %}
</head>

<body>

    <!-- HEADER/NAVBAR -->
    <header class="site-header">
        <div class="container nav-container">
            <a href="{% url 'main:show_main' %}" class="brand">
                Michelle<span>.</span>
            </a>

            <nav class="nav-links">
                <a href="{% url 'main:show_main' %}">Home</a>
                <a href="{% url 'main:show_main' %}#about">About</a>
                <a href="{% url 'main:show_main' %}#education">Education</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_projects' %}">Projects</a>
                <a href="{% url 'main:show_main' %}#skills">Skills</a>
            </nav>
        </div>
    </header>

    <!-- CONTENT UTAMA SETIAP HALAMAN -->
    {% block content %}
    {% endblock content %}

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container footer-content">
            <p>&copy; 2026 {{ name }}. All rights reserved.</p>
            <p>Designed & Built with Care.</p>
        </div>
    </footer>

</body>
</html>
